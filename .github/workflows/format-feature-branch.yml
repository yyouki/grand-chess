name: Format feature branch

on:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: write

concurrency:
  group: format-feature-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Format tracked Dart files
        run: git ls-files -z -- '*.dart' | xargs -0 -r dart format
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.dart'; then
            echo "Dart formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.dart'
          git commit -m "style: format Dart sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
