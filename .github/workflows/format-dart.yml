name: Format Dart

on:
  push:
    branches:
      - phase3/stage1

permissions:
  contents: read

concurrency:
  group: format-dart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Format Dart sources
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Format tracked Dart files
        run: |
          set -euo pipefail
          git ls-files -z -- '*.dart' | xargs -0 -r dart format

      - name: Verify formatting with the CI command
        run: dart format --output=none --set-exit-if-changed .

      - name: Publish formatting changes to a new branch
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/phase3/stage1" ]; then
            echo "Refusing to run for ${GITHUB_REF}. Only refs/heads/phase3/stage1 is allowed." >&2
            exit 1
          fi

          changed_files="$(git diff --name-only -- '*.dart')"
          if [ -z "${changed_files}" ]; then
            echo "No formatting changes. No branch was created."
            {
              echo "### Format Dart"
              echo "No formatting changes were needed. No branch was created."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          source_branch="${GITHUB_REF_NAME//\//-}"
          target_branch="format/${source_branch}-${GITHUB_SHA::7}"
          git check-ref-format --branch "${target_branch}" > /dev/null

          remote_status=0
          git ls-remote --exit-code --heads origin "refs/heads/${target_branch}" > /dev/null 2>&1 || remote_status=$?
          if [ "${remote_status}" -eq 0 ]; then
            echo "Branch ${target_branch} already exists. It was left untouched."
            {
              echo "### Format Dart"
              echo "Branch \`${target_branch}\` already exists and was left untouched."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ "${remote_status}" -ne 2 ]; then
            echo "Could not query the remote for ${target_branch} (git exit code ${remote_status})." >&2
            exit 1
          fi

          git switch --create "${target_branch}"
          git add -u -- '*.dart'

          if git diff --cached --quiet; then
            echo "Formatting changes were detected but nothing was staged." >&2
            exit 1
          fi

          non_dart_files="$(git diff --cached --name-only | grep -v '\.dart$' || true)"
          if [ -n "${non_dart_files}" ]; then
            echo "Refusing to commit non-Dart files:" >&2
            echo "${non_dart_files}" >&2
            exit 1
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit \
              --message "style: format Dart sources with dart format" \
              --message "Generated by the Format Dart workflow for ${GITHUB_SHA}. Formatting changes only."

          git push origin "HEAD:refs/heads/${target_branch}"

          pushed_sha="$(git ls-remote --heads origin "refs/heads/${target_branch}" | cut -f1)"
          if [ "${pushed_sha}" != "$(git rev-parse HEAD)" ]; then
            echo "The remote branch ${target_branch} does not point at the new commit." >&2
            exit 1
          fi

          {
            echo "### Format Dart"
            echo "Formatting changes were pushed to a new branch: \`${target_branch}\`."
            echo ""
            echo "Open a pull request: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${target_branch}?expand=1"
          } >> "${GITHUB_STEP_SUMMARY}"
