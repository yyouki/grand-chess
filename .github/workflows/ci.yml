name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate android directory if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Build Android (debug)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: hashFiles('windows/**') != ''
        with:
          channel: stable

      - name: Install dependencies
        if: hashFiles('windows/**') != ''
        run: flutter pub get

      - name: Build Windows (debug)
        if: hashFiles('windows/**') != ''
        run: flutter build windows --debug

      - name: Skip notice
        if: hashFiles('windows/**') == ''
        run: echo "::warning::windows/ directory not present yet."
