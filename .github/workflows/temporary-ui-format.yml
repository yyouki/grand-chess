name: Temporary formatter for visual refresh

on:
  push:
    branches:
      - feat/warm-minimal-visual-refresh

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format home screen
        run: dart format lib/ui/screens/home_screen.dart
      - name: Commit formatter output when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatter found no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/home_screen.dart
          git commit -m "style: format revised home layout"
          git push origin "HEAD:${GITHUB_REF_NAME}"
