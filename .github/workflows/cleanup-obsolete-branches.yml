name: Cleanup obsolete development branches

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove retired test and recovery branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete known obsolete development branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches="$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')"
          while IFS= read -r branch; do
            case "$branch" in
              main)
                continue
                ;;
              ci/v4-verification|test-baseline/v4|verify/v4-fixes|phase3/*|format/phase3-*)
                if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" >/dev/null 2>&1; then
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
                  echo "Deleted retired branch: $branch"
                else
                  echo "Already absent: $branch"
                fi
                ;;
              *)
                echo "Kept unrelated branch: $branch"
                ;;
            esac
          done <<< "$branches"
